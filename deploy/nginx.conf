server {
    listen 80 default_server;
    server_name _;

    root /srv/larbac/current/dist;
    index index.html;

    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /carlapinheiro {
        add_header Cache-Control "no-store" always;
        return 302 https://wa.me/message/PX7HOIJNOVTYB1;
    }

    location = /carlapinheiro/ {
        add_header Cache-Control "no-store" always;
        return 302 https://wa.me/message/PX7HOIJNOVTYB1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
