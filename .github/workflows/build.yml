name: Deploy to VPS on Tag

on:
  push:
    tags:
      - "v*.*.*"
      - "release-*"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build project
        run: pnpm run build
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.PUBLIC_GOOGLE_ANALYTICS_ID }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          tar -czf larbac-release.tar.gz dist deploy/nginx.conf
          scp -i ~/.ssh/deploy_key -P "${VPS_PORT:-22}" \
            larbac-release.tar.gz \
            "$VPS_USERNAME@$VPS_HOST:/tmp/larbac-$GITHUB_SHA.tar.gz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            "$VPS_USERNAME@$VPS_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          release="$1"
          app_root="$HOME/apps/larbac"
          release_dir="$app_root/releases/$release"
          artifact="/tmp/larbac-$release.tar.gz"

          mkdir -p "$release_dir"
          tar -xzf "$artifact" -C "$release_dir"
          rm -f "$artifact"

          ln -sfn "releases/$release" "$app_root/current.next"
          mv -Tf "$app_root/current.next" "$app_root/current"

          docker pull nginx:1.28-alpine
          docker rm -f larbac-web 2>/dev/null || true
          docker run -d \
            --name larbac-web \
            --restart unless-stopped \
            --network kamal \
            --volume "$app_root:/srv/larbac:ro" \
            --volume "$app_root/current/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine

          docker exec kamal-proxy kamal-proxy deploy larbac-web \
            --target larbac-web:80 \
            --host larbac.me \
            --host www.larbac.me \
            --canonical-host larbac.me \
            --health-check-path /up \
            --tls

          find "$app_root/releases" -mindepth 1 -maxdepth 1 -type d \
            -not -name "$release" -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +4 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf
          REMOTE
